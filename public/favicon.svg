<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Base diagonal gradient (purple → blue → teal) -->
    <linearGradient id="baseGrad" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <!-- Orange overlay (top-left influence) -->
    <radialGradient id="orangeGlow" cx="20%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0"/>
    </radialGradient>

    <!-- Pink overlay (bottom-left influence) -->
    <radialGradient id="pinkGlow" cx="30%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple highlight (top-right) -->
    <radialGradient id="purpleGlow" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>

    <!-- Center glow -->
    <radialGradient id="centerGlow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <circle cx="64" cy="64" r="60" fill="url(#baseGrad)"/>

  <!-- Color overlays -->
  <circle cx="64" cy="64" r="60" fill="url(#orangeGlow)"/>
  <circle cx="64" cy="64" r="60" fill="url(#pinkGlow)"/>
  <circle cx="64" cy="64" r="60" fill="url(#purpleGlow)"/>

  <!-- Inner glass -->
  <circle cx="64" cy="64" r="50" fill="white" fill-opacity="0.08"/>

  <!-- Compass marks -->
  <g stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="64" y1="10" x2="64" y2="22"/>
    <line x1="64" y1="106" x2="64" y2="118"/>
    <line x1="10" y1="64" x2="22" y2="64"/>
    <line x1="106" y1="64" x2="118" y2="64"/>
  </g>

  <!-- Diagonal ticks -->
  <g stroke="white" stroke-width="2" opacity="0.5">
    <line x1="24" y1="24" x2="32" y2="32"/>
    <line x1="104" y1="24" x2="96" y2="32"/>
    <line x1="24" y1="104" x2="32" y2="96"/>
    <line x1="104" y1="104" x2="96" y2="96"/>
  </g>

  <!-- Needle (TOP RED) -->
  <path d="M64 18 L74 64 L64 58 L54 64 Z" fill="#FF3B3B"/>

  <!-- Needle (BOTTOM BLUE) -->
  <path d="M64 110 L74 64 L64 70 L54 64 Z" fill="#22D3EE"/>

  <!-- Center -->
  <circle cx="64" cy="64" r="6" fill="white"/>

  <!-- Glow -->
  <circle cx="64" cy="64" r="25" fill="url(#centerGlow)"/>

</svg>